name: Build IPK

on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: earc-volume-overlay-ipk
          path: |
            build/*.ipk
      - name: Build release archive
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run release
      - name: Build webosbrew manifest
        run: sh scripts/make-manifest.sh
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            build/*.ipk
            release/com.sammysco.avoverlay.manifest.json
    permissions:
      contents: write
