name: Build IPK

on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: av-overlay-ipk
          path: build/*.ipk
