name: Compatibility report
description: Tell us what works (or does not) on your TV and receiver
labels: [compatibility]
body:
  - type: input
    id: tv
    attributes:
      label: LG TV model and webOS version
    validations:
      required: true
  - type: input
    id: receiver
    attributes:
      label: Yamaha receiver model
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - Works fully
        - Works with problems
        - Does not work
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Which features work (volume popup, info bar, sound programs, Plex or Jellyfin details)? Anything unusual about your setup?
