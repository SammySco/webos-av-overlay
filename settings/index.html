<!doctype html>
<html><head><meta charset="utf-8"><title>AV Overlay Settings</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}
body{display:flex;align-items:center;justify-content:center;font-family:Arial,Helvetica,sans-serif;color:#fff;background:radial-gradient(ellipse at 50% 35%,#25252a 0%,#111114 55%,#050506 100%)}
.panel{width:900px;text-align:center}h1{margin:0 0 20px;font-size:48px;font-weight:300}p{margin:0 0 34px;color:#b7b7bd;font-size:24px;line-height:1.45}
button{padding:18px 34px;border:2px solid #4a4a51;border-radius:16px;background:#202025;color:#eee;font-size:24px;outline:none}button:focus{border-color:#fff;background:#303037;transform:scale(1.05)}
</style></head><body>
<div class="panel"><h1 id="title">AV Overlay</h1><p id="msg">Opening settings...</p><button id="retry" style="display:none">Try again</button></div>
<script>
(function(){
var BASE='http://127.0.0.1:41101',msg=document.getElementById('msg'),retry=document.getElementById('retry');
function open(){
  retry.style.display='none';msg.textContent='Opening settings...';
  var x=new XMLHttpRequest();x.timeout=3000;
  x.onload=function(){if(x.status===200)location.replace(BASE+'/setup');else fail()};
  x.onerror=x.ontimeout=fail;
  try{x.open('GET',BASE+'/status.json',true);x.send()}catch(e){fail()}
}
function fail(){
  msg.textContent='The overlay service is not running. Check that the TV is rooted, then reboot the TV or run the installer again.';
  retry.style.display='inline-block';retry.focus();
}
retry.onclick=open;
open();
}());
</script></body></html>
