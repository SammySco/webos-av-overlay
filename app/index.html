<!doctype html>
<html><head><meta charset="utf-8"><title>eARC Volume Overlay</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{font-family:Arial,Helvetica,sans-serif;color:#fff;background:transparent}
#setup{display:none;position:absolute;top:0;right:0;bottom:0;left:0;padding:110px 150px;background:radial-gradient(ellipse at 50% 35%,#25252a 0%,#111114 55%,#050506 100%)}body.setup-mode #setup{display:block}.panel{width:940px;margin:0 auto;text-align:center}.mark{width:116px;height:116px;margin:0 auto 30px;border-radius:26px;background:#171719 url('largeIcon.png') center/116px 116px no-repeat}h1{margin:0;font-size:54px;font-weight:300;letter-spacing:-.02em}.description{margin:20px auto 38px;max-width:760px;color:#b7b7bd;font-size:25px;line-height:1.45}#status{display:inline-block;min-width:270px;padding:12px 22px;margin-bottom:42px;border:1px solid #3b3b42;border-radius:999px;background:#19191d;color:#c8c8ce;font-size:22px}#status.enabled{border-color:#3f7255;color:#9fe0b6}#status.error{border-color:#8c4a4a;color:#ffaaaa}.buttons{display:flex;justify-content:center}button{min-width:215px;margin:0 10px;padding:20px 30px;border:2px solid #4a4a51;border-radius:17px;background:#202025;color:#eee;font-size:25px;outline:none}button:focus{border-color:#fff;background:#303037;transform:scale(1.05)}.note{margin-top:42px;color:#77777f;font-size:19px}
#overlay{display:none;position:absolute;right:62px;bottom:62px;min-width:150px;transform:scale(.94);transform-origin:bottom right;opacity:0;padding:23px 28px;text-align:center;background:rgba(16,16,18,.88);border:1px solid rgba(255,255,255,.17);border-radius:22px;box-shadow:0 10px 35px rgba(0,0,0,.48)}body.overlay-mode #overlay{display:block}#overlay.show{opacity:1;transform:scale(1)}#value{font-size:var(--vol-px,82px);font-weight:300;line-height:1;font-variant-numeric:tabular-nums}
#info{display:none;position:absolute;top:34px;left:48px;right:auto;width:max-content;text-align:left;transform:translateY(-14px);opacity:0;padding:14px 26px;background:rgba(16,16,18,.9);border:1px solid rgba(255,255,255,.17);border-radius:18px;box-shadow:0 10px 35px rgba(0,0,0,.48);white-space:nowrap}body.overlay-mode #info{display:block}#info.show{opacity:1;transform:translateY(0)}#info-line{display:block;text-align:left;font-size:var(--info-px,24px);line-height:1.4}#info-title{display:block;font-size:var(--info-title-px,27px);font-weight:600;color:#fff;margin-bottom:4px}#info-title:empty{display:none}.seg{display:block;color:#d6d6dc}.sep{display:none}#chan-entry{display:block;margin-top:8px;font-size:var(--info-chan-px,30px);font-weight:600;color:#fff}
#info[data-pos="top-right"]{left:auto;right:48px}
#info[data-pos="top-center"]{left:50%;right:auto;transform:translate(-50%,-14px)}#info[data-pos="top-center"].show{transform:translate(-50%,0)}
#info[data-pos="bottom-left"],#info[data-pos="bottom-right"],#info[data-pos="bottom-center"]{top:auto;bottom:34px;transform:translateY(14px)}#info[data-pos="bottom-left"].show,#info[data-pos="bottom-right"].show{transform:translateY(0)}
#info[data-pos="bottom-right"]{left:auto;right:48px}#info[data-pos="bottom-center"]{left:50%;right:auto;transform:translate(-50%,14px)}#info[data-pos="bottom-center"].show{transform:translate(-50%,0)}
#info[data-pos="middle-left"],#info[data-pos="middle-right"]{top:50%;transform:translateY(calc(-50% - 14px))}#info[data-pos="middle-left"].show,#info[data-pos="middle-right"].show{transform:translateY(-50%)}
#info[data-pos="middle-right"]{left:auto;right:48px}
#info.banner #info-title{display:inline;margin-bottom:0}#info.banner .seg{display:inline}#info.banner .sep{display:inline}
</style></head><body>
<main id="setup"><div class="panel"><div class="mark"></div><h1>eARC Volume Overlay</h1><p class="description">Shows the soundbar or receiver's numeric volume in the bottom-right corner whenever it changes.</p><div id="status">Checking status…</div><div class="buttons"><button id="enable">Enable</button><button id="disable">Disable</button><button id="test">Test overlay</button></div><p class="note">Requires a rooted TV and Homebrew Channel. Disable the overlay here before uninstalling the app.</p></div></main>
<div id="overlay"><div id="value">0</div></div>
<div id="info"><div id="info-line"></div></div>
<script>
(function(){
var APP_ID='com.sammysco.avoverlay',SERVICE='luna://org.webosbrew.hbchannel.service/exec',HOOK='/var/lib/webosbrew/init.d/91-earc-volume-overlay',PIDFILE='/tmp/earc-volume-overlay.pid';
var watcherBase='http://127.0.0.1:41101';
var overlay=document.getElementById('overlay'),value=document.getElementById('value'),status=document.getElementById('status'),info=document.getElementById('info'),infoLine=document.getElementById('info-line'),visible={vol:false,info:false},timers={},pinned=false;
var findApp=['APP_DIR=','for BASE in /media/developer/apps/usr/palm/applications /media/cryptofs/apps/usr/palm/applications; do','  if [ -f "$BASE/'+APP_ID+'/runtime/watcher.js" ]; then APP_DIR="$BASE/'+APP_ID+'"; break; fi','done','[ -n "$APP_DIR" ] || { echo app-not-found; exit 1; }'].join('\n');
var enableCommand=[findApp,'mkdir -p /var/lib/webosbrew/init.d','chmod 755 "$APP_DIR/runtime/91-earc-volume-overlay"','ln -sf "$APP_DIR/runtime/91-earc-volume-overlay" "'+HOOK+'"','if [ -f /var/lib/earc-volume-overlay/watcher.pid ]; then','  OLD=$(cat /var/lib/earc-volume-overlay/watcher.pid 2>/dev/null || true)','  [ -z "$OLD" ] || kill "$OLD" 2>/dev/null || true','fi','rm -rf /var/lib/earc-volume-overlay','"'+HOOK+'"','echo enabled'].join('\n');
var disableCommand=['if [ -f "'+PIDFILE+'" ]; then','  PID=$(cat "'+PIDFILE+'" 2>/dev/null || true)','  if [ -n "$PID" ] && kill -0 "$PID" 2>/dev/null; then','    CMD=$(tr "\\000" " " < "/proc/$PID/cmdline" 2>/dev/null || true)','    case "$CMD" in *watcher.js*) kill "$PID" 2>/dev/null || true;; esac','  fi','fi','rm -f "'+PIDFILE+'" "'+HOOK+'"','echo disabled'].join('\n');
var statusCommand=['if [ -L "'+HOOK+'" ] || [ -f "'+HOOK+'" ]; then','  PID=$(cat "'+PIDFILE+'" 2>/dev/null || true)','  if [ -n "$PID" ] && kill -0 "$PID" 2>/dev/null; then echo enabled-running; else echo enabled-stopped; fi','else echo disabled; fi'].join('\n');
function paramsOf(input){var p=input;try{if(typeof p==='string')p=JSON.parse(p)}catch(e){p={}}if(!p||typeof p!=='object')p={};if(p.params&&typeof p.params==='object')p=p.params;return p}
function hasVolume(p){return Object.prototype.hasOwnProperty.call(p,'volume')||Object.prototype.hasOwnProperty.call(p,'mute')}
function rootExec(command,callback){if(!window.PalmServiceBridge){callback(new Error('Homebrew root service is unavailable'));return}var bridge=new PalmServiceBridge();bridge.onservicecallback=function(raw){var response;try{response=JSON.parse(raw)}catch(e){callback(e);return}if(response.returnValue===false||response.error)callback(new Error(response.errorText||response.error||'Command failed'));else callback(null,response.stdoutString||'')};bridge.call(SERVICE,JSON.stringify({command:command}))}
function setStatus(text,kind){status.textContent=text;status.className=kind||''}
function refreshStatus(){setStatus('Checking status…');rootExec(statusCommand,function(error,output){if(error){setStatus(error.message,'error');return}if(output.indexOf('enabled-running')!==-1)setStatus('Enabled and running','enabled');else if(output.indexOf('enabled-stopped')!==-1)setStatus('Enabled; restart required','error');else setStatus('Disabled')})}
function showSetup(){pinned=false;document.body.className='setup-mode';overlay.className='';info.className='';visible.vol=visible.info=false;refreshStatus();window.setTimeout(function(){document.getElementById('enable').focus()},30);if(window.PalmSystem&&PalmSystem.activate)PalmSystem.activate()}
function hideLater(name,el,ms,preview){if(timers[name])window.clearTimeout(timers[name]);timers[name]=window.setTimeout(function(){el.className='';visible[name]=false;window.setTimeout(function(){if(!visible.vol&&!visible.info){if(preview)showSetup();else goIdle()}},0)},ms)}
function passThrough(){try{if(window.PalmSystem&&PalmSystem.setInputRegion)PalmSystem.setInputRegion([])}catch(e){}try{if(window.PalmSystem&&PalmSystem.window&&PalmSystem.window.setFocus)PalmSystem.window.setFocus(false)}catch(e){}}
function reveal(name,el){passThrough();document.body.className='overlay-mode';visible[name]=true;el.className='show'}
function showOverlay(input,preview){var p=paramsOf(input),n=Number(p.volume);if(!isFinite(n))n=0;n=Math.round(n*2)/2;value.textContent=(p.mute===true||p.muted===true)?'Mute':(typeof p.text==='string'&&p.text?p.text:(n%1?n.toFixed(1):String(n)));reveal('vol',overlay);hideLater('vol',overlay,1850,preview)}
function showInfo(input,preview){var p=paramsOf(input);info.setAttribute('data-pos',p.corner||'top-left');var layout=(p.info&&p.info.layout)||'stack';var showMs=(p.info&&typeof p.info.showMs==='number'&&p.info.showMs>=500)?p.info.showMs:5000;var d=p.info||{},segs=(d.segs||(d.rows||[]).map(function(r){return r[1]})).filter(function(x){return !!x});while(infoLine.firstChild)infoLine.removeChild(infoLine.firstChild);var t=document.createElement('span');t.id='info-title';t.textContent=d.title||'';infoLine.appendChild(t);segs.forEach(function(x){var e=document.createElement('span'),sp=document.createElement('span');e.className='seg';sp.className='sep';sp.textContent=' | ';e.appendChild(sp);e.appendChild(document.createTextNode(x));infoLine.appendChild(e)});reveal('info',info);if(layout==='banner')info.classList.add('banner');else info.classList.remove('banner');if(layout!=='banner'){window.setTimeout(function(){var kids=infoLine.children;for(var i=1;i<kids.length;i++){var sp=kids[i].firstChild;if(sp&&sp.className==='sep')sp.style.display=kids[i].offsetTop>kids[i-1].offsetTop+4?'none':''}},30)}else{Array.prototype.forEach.call(infoLine.querySelectorAll('.sep'),function(sp){sp.style.display=''})}if(pinned){if(timers.info)window.clearTimeout(timers.info)}else hideLater('info',info,showMs,preview)}
function goIdle(){document.body.className='';try{window.close()}catch(e){}}
function report(v){try{var r=new XMLHttpRequest();r.open('GET',watcherBase+'/tv/pinstate?v='+v,true);r.timeout=2000;r.send()}catch(e){}}
function unpin(){pinned=false;report(0);if(timers.info)window.clearTimeout(timers.info);info.className='';visible.info=false;window.setTimeout(function(){if(!visible.vol&&!visible.info)goIdle()},300)}
function qaPress(){document.body.className='overlay-mode';var done=false,x=new XMLHttpRequest();function fail(){if(done)return;done=true;pinned=false;showSetup()}x.onreadystatechange=function(){if(x.readyState===4){if(x.status===200){done=true;window.setTimeout(function(){if(!visible.info&&!visible.vol)goIdle()},4000)}else fail()}};x.onerror=fail;try{x.open('GET',watcherBase+'/tv/qa',true);x.timeout=2500;x.ontimeout=fail;x.send()}catch(e){fail()}}
function applyFontSizes(p){var r=document.documentElement.style;if(p&&p.volFontSize){r.setProperty('--vol-px',Math.round(82*p.volFontSize/100)+'px')}if(p&&p.infoFontSize){r.setProperty('--info-px',Math.round(24*p.infoFontSize/100)+'px');r.setProperty('--info-title-px',Math.round(27*p.infoFontSize/100)+'px');r.setProperty('--info-chan-px',Math.round(30*p.infoFontSize/100)+'px')}};function route(p,preview){if(p&&typeof p.watcherBase==='string'&&p.watcherBase)watcherBase=p.watcherBase;applyFontSizes(p);if(p&&p.hide)unpin();else if(p&&p.info){if(p.pin){pinned=true;report(1)}showInfo(p,preview)}else if(hasVolume(p))showOverlay(p,preview);else if(p&&p.setup)showSetup();else qaPress()}
document.getElementById('enable').onclick=function(){setStatus('Enabling…');rootExec(enableCommand,function(error){if(error)setStatus(error.message,'error');else refreshStatus()})};
document.getElementById('disable').onclick=function(){setStatus('Disabling…');rootExec(disableCommand,function(error){if(error)setStatus(error.message,'error');else refreshStatus()})};
document.getElementById('test').onclick=function(){showOverlay({volume:42,mute:false},true);showInfo({info:{title:'Straight',segs:['HDMI 1','PCM · 48 kHz','Enhancer · Dialogue 2 · Sub +1.5 dB','3840×2160p · 24 fps · Dolby Vision','RGB Full · DCI-P3 D65']}},true)};
var chanBuf='',chanTimer=null;
function dismissNow(){pinned=false;report(0);document.body.className='';visible.vol=visible.info=false;window.setTimeout(function(){if(!visible.vol&&!visible.info&&document.body.className==='')try{window.close()}catch(e){}},250)}
function commitChannel(){if(chanTimer){window.clearTimeout(chanTimer);chanTimer=null}var n=chanBuf;chanBuf='';if(!n)return;try{var r=new XMLHttpRequest();r.open('GET',watcherBase+'/tv/key?chan='+n+'&fwd=1&pin='+(pinned?1:0),true);r.send()}catch(e){}dismissNow()}
function showChanEntry(){var e=document.getElementById('chan-entry');if(!e){e=document.createElement('span');e.id='chan-entry';infoLine.appendChild(e)}e.textContent='Channel '+chanBuf+'_'}
document.addEventListener('keydown',function(event){var kc=event.keyCode,digit=(kc>=48&&kc<=57)?kc-48:((kc>=96&&kc<=105)?kc-96:-1);
if(document.body.className==='overlay-mode'&&visible.info){
if(digit>=0&&chanBuf.length<4){chanBuf+=String(digit);if(timers.info)window.clearTimeout(timers.info);showChanEntry();if(chanTimer)window.clearTimeout(chanTimer);chanTimer=window.setTimeout(commitChannel,1800);event.preventDefault();return}
if(kc===13&&chanBuf){commitChannel();event.preventDefault();return}
if(chanBuf){chanBuf='';if(chanTimer){window.clearTimeout(chanTimer);chanTimer=null}}}
try{var kr=new XMLHttpRequest();var dis=document.body.className==='overlay-mode';kr.open('GET',watcherBase+'/tv/key?'+event.keyCode+(dis?'&fwd=1&pin='+(pinned?1:0):''),true);kr.send()}catch(e){}if(document.body.className==='overlay-mode'){pinned=false;report(0);document.body.className='';visible.vol=visible.info=false;window.setTimeout(function(){if(!visible.vol&&!visible.info&&document.body.className==='')try{window.close()}catch(e){}},250);return}var buttons=Array.prototype.slice.call(document.querySelectorAll('button')),index=buttons.indexOf(document.activeElement);if(event.keyCode===37&&index>0){buttons[index-1].focus();event.preventDefault()}if(event.keyCode===39&&index>=0&&index<buttons.length-1){buttons[index+1].focus();event.preventDefault()}});
window.webOSRelaunch=function(){var updated={};try{updated=window.PalmSystem?PalmSystem.launchParams:{}}catch(e){}updated=paramsOf(updated);route(updated,false);return true};
document.addEventListener('webOSRelaunch',function(event){var updated=paramsOf(event&&event.detail?event.detail:{});route(updated,false)},true);
var initial={};try{initial=window.PalmSystem?PalmSystem.launchParams:{}}catch(e){}initial=paramsOf(initial);route(initial,false);
}());
</script></body></html>
